version: 2
updates:
- package-ecosystem: nuget
  directory: "/src/Hacked"
  schedule:
    interval: monthly
    time: "10:00"
  open-pull-requests-limit: 1
  labels:
  - kind/dependency
  - do-not-merge/work-in-progress
  groups:
    nuget-uwp:
      patterns:
      - "*"

- package-ecosystem: nuget
  directory: "/src/Hacked.Maui"
  schedule:
    interval: monthly
    time: "10:00"
  open-pull-requests-limit: 1
  labels:
  - kind/dependency
  - do-not-merge/work-in-progress
  groups:
    nuget-maui:
      patterns:
      - "*"