name: Release MAUI (Windows Digicert)

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - '.github/workflows/release-maui-tester.yml'
  # pull_request:
  #   types: []  # Explicitly disabled - external PRs cannot trigger this workflow

defaults:
  run:
    shell: pwsh

env:
  PROJECT_PATH: "src/Hacked.Maui/Hacked.Maui.csproj"
  SDK_VERSION: '10.0.203'
  NET_TFM: 'net10.0'
  NUGET_CONFIG_PATH: 'src/nuget.config'
  TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
  TELERIK_LICENSE: ${{secrets.TELERIK_LICENSE_KEY_VALUE}}

jobs:
  # *********************************************************************************** #
  #                                   Shared Resources                                  #
  # *********************************************************************************** #
  shared-resources:
    name: Create Shared Resources
    runs-on: windows-2025-vs2026
    outputs:
      app_version: ${{steps.version-creator.outputs.app_version}}
    steps:
    # Generates a version number using year.monthday.run_number (e.g., 2024.824.1)
    - name: Generate version number using date and run number
      id: version-creator
      shell: pwsh
      run: |
        $buildDay = Get-Date -Format "yyyy.Mdd"
        $runNumber = "$env:GITHUB_RUN_NUMBER"
        $ver = $buildDay + "." + $runNumber
        echo "app_version=$ver" >> $env:GITHUB_OUTPUT

  # ********************************************************************************** #
  #                                  Windows Sideload                                  #
  # ********************************************************************************** #
  maui-windows-sideload:
    name: Build Windows (${{ matrix.arch }})
    needs: shared-resources
    runs-on: [self-hosted, x64, digicert-enabled]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runtime_id: win-x64
            platform: x64
          - arch: arm64
            runtime_id: win-arm64
            platform: ARM64
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set Telerik NuGet Credentials
      run: dotnet nuget update source 'Telerik_v3_Feed' -s 'https://nuget.telerik.com/v3/index.json' -u 'api-key' -p "${{secrets.TELERIK_NUGET_KEY}}" --configfile '${{env.NUGET_CONFIG_PATH}}' --store-password-in-clear-text

    # Update the app manifest before publish. Identity/@Publisher MUST match the
    # DigiCert signing cert's Subject exactly, or signing the final .msixbundle
    # will fail. We look up the cert on the runner and write its subject in.
    - name: Update manifest for side load build
      run: |
        $manifestPath = 'src\Hacked.Maui\Platforms\Windows\Package.appxmanifest'
        $thumbprint = '8BC202959D2DCE3EEB3A489D8348B5C9B6B64A97'
        $cert = Get-Item "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
        if (-not $cert) { $cert = Get-Item "Cert:\LocalMachine\My\$thumbprint" -ErrorAction SilentlyContinue }
        if (-not $cert) { throw "Signing certificate $thumbprint not found in CurrentUser\My or LocalMachine\My" }
        $publisherSubject = $cert.Subject
        Write-Host "Setting Identity/@Publisher to: $publisherSubject"

        [xml]$manifest = Get-Content $manifestPath
        $ns = $manifest.DocumentElement.NamespaceURI
        $nsmgr = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
        $nsmgr.AddNamespace('m', $ns)

        $identityNode = $manifest.SelectSingleNode('/m:Package/m:Identity', $nsmgr)
        if ($null -eq $identityNode) { throw 'Identity node not found in Package.appxmanifest' }
        $identityNode.SetAttribute('Version', "${{needs.shared-resources.outputs.app_version}}.0")
        $identityNode.SetAttribute('Publisher', $publisherSubject)
        $identityNode.SetAttribute('ProcessorArchitecture', '${{matrix.arch}}')

        $publisherDisplayNode = $manifest.SelectSingleNode('/m:Package/m:Properties/m:PublisherDisplayName', $nsmgr)
        if ($null -ne $publisherDisplayNode) { $publisherDisplayNode.InnerText = 'Lancelot Software' }

        $displayNameNode = $manifest.SelectSingleNode('/m:Package/m:Properties/m:DisplayName', $nsmgr)
        if ($null -ne $displayNameNode) { $displayNameNode.InnerText = 'Hacked?' }

        $manifest.Save($manifestPath)

    - name: Set API Key
      run: |
        $file = 'src/Hacked.Maui/appsettings.json'
        $config = Get-Content $file -Raw | ConvertFrom-Json
        $config.HibpApiKey = $env:HIBP_API_KEY
        $config | ConvertTo-Json -Depth 10 | Set-Content -Path $file -Encoding utf8NoBOM
      env:
        HIBP_API_KEY: ${{secrets.HIBP_API_KEY}}

    # Self-hosted runner persists workspace; remove stale outputs so the
    # MSIX we discover is guaranteed to be from THIS run.
    - name: Clean prior publish outputs
      run: |
        Remove-Item -Recurse -Force "src\Hacked.Maui\AppPackages" -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "src\Hacked.Maui\bin\${{matrix.platform}}" -ErrorAction SilentlyContinue
          
    # Standard MAUI Windows MSIX publish. dotnet publish does its own restore.
    # Self-hosted runner already has MAUI workloads installed; do NOT call
    # `dotnet workload restore` (it updates manifests and breaks the build).
    # Per-arch MSIX packages are NOT signed here; the final .msixbundle is
    # signed once in the bundle-msix job.
    - name: Publish ${{ matrix.arch }} package
      id: publish-package
      run: |
        $appVersion = "${{needs.shared-resources.outputs.app_version}}.0"
        $artifactDir = "${{github.workspace}}\artifacts\${{matrix.arch}}"

        New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

        Write-Host "Publishing ${{matrix.arch}}..."

        $publishArgs = @(
          'publish'
          '${{env.PROJECT_PATH}}'
          '-c', 'Release'
          '-f', '${{env.NET_TFM}}-windows10.0.19041.0'
          '-p:Platform=${{matrix.platform}}'
          '-p:AppxPackageBuildPlatform=${{matrix.platform}}'
          '-p:RuntimeIdentifierOverride=${{matrix.runtime_id}}'
          '-p:GenerateAppxPackageOnBuild=true'
          '-p:AppxPackageSigningEnabled=false'
          '-p:UapAppxPackageBuildMode=SideloadOnly'
          '-p:AppxBundle=Never'
          '-p:WindowsPackageType=MSIX'
        )
        & dotnet @publishArgs
        if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for ${{matrix.arch}} with exit code $LASTEXITCODE" }

        # MAUI writes MSIX to src\Hacked.Maui\AppPackages\<name>_<ver>_<arch>_Test\*.msix
        $appPackagesRoot = "src\Hacked.Maui\AppPackages"
        $candidates = Get-ChildItem -Path $appPackagesRoot -Filter *.msix -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -notmatch '\\Dependencies\\' -and $_.Name -match "_${{matrix.arch}}\.msix$" }
        Write-Host "Found $($candidates.Count) candidate MSIX file(s) for ${{matrix.arch}}:"
        $candidates | ForEach-Object { Write-Host "  $($_.FullName)" }
        $msix = $candidates | Sort-Object LastWriteTime -Descending | Select-Object -ExpandProperty FullName -First 1
        if (-not $msix) { throw "No .msix found after publish for ${{matrix.arch}}" }
        Write-Host "Found ${{matrix.arch}} package: $msix"
        Copy-Item -Path $msix -Destination "$artifactDir\Hacked.${{matrix.arch}}.msix" -Force
        
        echo "PACKAGE_PATH=$artifactDir\Hacked.${{matrix.arch}}.msix" >> $env:GITHUB_OUTPUT

    - name: Upload ${{ matrix.arch }} artifact
      uses: actions/upload-artifact@v7
      with:     
        name: "Hacked_v${{needs.shared-resources.outputs.app_version}}_${{matrix.arch}}"
        path: ${{steps.publish-package.outputs.PACKAGE_PATH}}
        if-no-files-found: error
        retention-days: 30

  # ********************************************************************************** #
  #                              Bundle MSIX -> MSIXBUNDLE                             #
  # ********************************************************************************** #
  bundle-msix:
    name: Bundle MSIX packages
    needs: [shared-resources, maui-windows-sideload]
    runs-on: [self-hosted, x64, digicert-enabled]
    steps:
    - name: Clean bundle workspace
      run: |
        Remove-Item -Recurse -Force "${{github.workspace}}\bundle-input" -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "${{github.workspace}}\bundle-output" -ErrorAction SilentlyContinue

    - name: Download x64 artifact
      uses: actions/download-artifact@v8
      with:
        name: "Hacked_v${{needs.shared-resources.outputs.app_version}}_x64"
        path: ${{github.workspace}}\bundle-input

    - name: Download arm64 artifact
      uses: actions/download-artifact@v8
      with:
        name: "Hacked_v${{needs.shared-resources.outputs.app_version}}_arm64"
        path: ${{github.workspace}}\bundle-input

    - name: Create MSIX bundle
      id: bundle
      run: |
        $appVersion = "${{needs.shared-resources.outputs.app_version}}.0"
        $inputDir = "${{github.workspace}}\bundle-input"
        $outputDir = "${{github.workspace}}\bundle-output"
        New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

        # Locate makeappx.exe from the latest installed Windows 10 SDK
        $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
        $makeAppx = Get-ChildItem -Path $sdkRoot -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $makeAppx) { throw "makeappx.exe not found under $sdkRoot" }
        Write-Host "Using makeappx: $($makeAppx.FullName)"

        Get-ChildItem $inputDir -Filter *.msix | ForEach-Object { Write-Host "Input: $($_.FullName)" }

        $bundlePath = "$outputDir\Hacked_v${{needs.shared-resources.outputs.app_version}}.msixbundle"
        & $makeAppx.FullName bundle /d $inputDir /p $bundlePath /bv $appVersion /o
        if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed with exit code $LASTEXITCODE" }

        echo "BUNDLE_PATH=$bundlePath" >> $env:GITHUB_OUTPUT

    - name: Sign MSIX bundle
      run: |
        $sacTools = "C:\Program Files\SafeNet\Authentication\SAC\x64\SACTools.exe"
        & $sacTools /Token /LogOn /Password "${{secrets.DIGICERT_HARDWARE_TOKEN_PASSWORD}}"

        $thumbprint = "8BC202959D2DCE3EEB3A489D8348B5C9B6B64A97"
        $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
        $signTool = Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signTool) { throw "signtool.exe not found under $sdkRoot" }
        Write-Host "Using signtool: $($signTool.FullName)"

        & $signTool.FullName sign /fd SHA256 /sha1 $thumbprint /tr http://timestamp.digicert.com /td SHA256 "${{steps.bundle.outputs.BUNDLE_PATH}}"
        if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }

    - name: Upload MSIX bundle artifact
      uses: actions/upload-artifact@v7
      with:
        name: "Hacked_v${{needs.shared-resources.outputs.app_version}}_msixbundle"
        path: ${{steps.bundle.outputs.BUNDLE_PATH}}
        if-no-files-found: error
        retention-days: 30
