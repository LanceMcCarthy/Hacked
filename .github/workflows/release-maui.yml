name: Build .NET MAUI

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'src/Hacked.Maui/**/*'
  #     - '.github/workflows/build-maui.yml'

defaults:
  run:
    shell: pwsh

env:
  MACOS_ARTIFACTS_PATH: "artifacts_macos"
  IOS_ARTIFACTS_PATH: "artifacts_ios"
  ANDROID_ARTIFACTS_PATH: "artifacts_android"
  WINDOWS_ARTIFACTS_PATH: "artifacts_windows"
  PROJECT_PATH: "src/Hacked.Maui/Hacked.maui.csproj"
  SDK_VERSION: '10.0.x'
  NET_TFM: 'net10.0'
  NUGET_CONFIG_PATH: 'src/nuget.config'
  TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
  XCODE_VERSION: '26.2'
  APPLE_CODESIGN_KEY: "Apple Distribution: Lancelot Software (L25222N3C7)"
  APPLE_APP_ID: "com.lancelotsoftware.HackedApp"
  APPLE_CODESIGN_ENTITLEMENTS: "Platforms/MacCatalyst/Entitlements.plist"
  APPLE_MAC_CODESIGN_PROV_PROFILE: "HackedApp_maccatalyst_appstore"
  APPLE_MAC_CODESIGN_PROFILE_TYPE: "MAC_APP_STORE"

jobs:
  # ******************************** #
  # >>>>>>> Common Resources <<<<<<< #
  # ******************************** #
  shared-resources:
    name: Create Shared Resources
    runs-on: windows-latest
    outputs:
      app_version: ${{steps.version-creator.outputs.app_version}}
    steps:
    # Generates a version number using year.monthday.run_number.0 (e.g., 2024.824.1.0)
    - name: Generate version number using date and run number
      id: version-creator
      run: |
        $buildDay = Get-Date -Format "yyyy.Mdd"
        $runNumber = "$env:GITHUB_RUN_NUMBER"
        $ver = $buildDay + "." + $runNumber + ".0"
        echo "app_version=$ver" >> $env:GITHUB_OUTPUT


  # *********************************** #
  # >>>>>>> Windows Store build <<<<<<< #
  # *********************************** #
  build-windows:
    runs-on: windows-latest
    needs: shared-resources
    if: ${{ success() && needs.shared-resources.outputs.app_version != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.SDK_VERSION}}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Install MAUI Workloads
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Add Telerik NuGet Server
        run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}} 

      - name: Build Maui WinUI project
        run: dotnet publish ${{env.PROJECT_PATH}} -c Debug -f ${{env.NET_TFM}}-windows10.0.19041.0

      - name: Create artifacts folder
        run: |
           cd ${{github.workspace}}
           mkdir -p ${{env.WINDOWS_ARTIFACTS_PATH}}

      - name: Copy WinUI msix package
        run: Get-Childitem -Path ${{github.workspace}} -Include *.msix -File -Recurse | Copy-Item -Destination ${{env.WINDOWS_ARTIFACTS_PATH}}

      # - name: Publish build artifacts
      #   uses: actions/upload-artifact@v4
      #   with:     
      #     name: "WinUI .NET MAUI artifacts" 
      #     path: "${{env.WINDOWS_ARTIFACTS_PATH}}/*"
      #     if-no-files-found: warn
      #     retention-days: 60


  # ************************************** #
  # >>>>>>> Windows Sideload build <<<<<<< #
  # ************************************** #
  maui-windows-sideload:
    name: Build Windows Sideload
    needs: shared-resources
    runs-on: windows-2022
    if: ${{ needs.shared-resources.outputs.app_version != ''}}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{env.SDK_VERSION}}

    # Needed only for WinUI builds
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install MAUI workloads
      run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

    - name: Set Telerik NuGet Credentials
      run: dotnet nuget update source 'Telerik_v3_Feed' -s 'https://nuget.telerik.com/v3/index.json' -u 'api-key' -p "${{secrets.TELERIK_NUGET_KEY}}" --configfile 'src/NuGet.Config' --store-password-in-clear-text

    - name: Restore NuGet packages
      run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}}

    # Update the app manifest
    - name: Update manifest for side load build
      run: |
        [xml]$manifest = get-content 'src\Hacked.Maui\Platforms\Windows\Package.appxmanifest'
        $manifest.Package.Identity.Version = "${{needs.shared-resources.outputs.app_version}}"
        $manifest.save("src\Hacked.Maui\Platforms\Windows\Package.appxmanifest")

    - name: Build WinUI ${{matrix.RID}} 
      run: dotnet publish ${{env.PROJECT_PATH}} -f ${{env.NET_TFM}}-windows10.0.19041.0 -p:PublishProfile=BetaTesters-Windows-MSIX-Bundle

    - name: Locate msix
      id: find-msix-file
      run: |
        $msixPath = Get-ChildItem -Filter Hacked*.msix -Recurse | %{$_.FullName}
        echo "PACKAGE_PATH=$msixPath" >> $env:GITHUB_OUTPUT

    # Entra ID App Registration (Akeyless OIDC Provider) > Certificates and Secrets > Federated Credentials
    - name: Azure login using OIDC via GitHub
      uses: azure/login@v2
      id: azlogin
      with:
        client-id: "32daa13b-f4bb-4809-8ef6-58cb39051acd"
        tenant-id: "bd47e796-3473-4b8a-9101-1f4c0c7af31a"
        subscription-id: "48ab4839-62af-4ab3-afe6-043ea4d7c137"

    - name: Sign files with Trusted Signing
      uses: azure/trusted-signing-action@v1.2.0
      with:
        endpoint: https://eus.codesigning.azure.net/
        trusted-signing-account-name: PrimaryCodeSign
        certificate-profile-name: lancemccarthylivepublic
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        file-digest: SHA256
        files: ${{steps.find-msix-file.outputs.PACKAGE_PATH}}
        exclude-azure-cli-credential: false
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    - name: Attach artifacts to workflow run
      uses: actions/upload-artifact@v4
      with:     
        name: "Hacked_v${{needs.shared-resources.outputs.app_version}}_${{matrix.RID}}.msix" 
        path: ${{steps.find-msix-file.outputs.PACKAGE_PATH}}
        if-no-files-found: error
        retention-days: 30

  # ***************************** #
  # >>>>>>> Android build <<<<<<< #
  # ***************************** #
  build-android:
    runs-on: windows-latest
    needs: shared-resources
    if: ${{ success() && needs.shared-resources.outputs.app_version != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Decode the Keystore
        run: |
          $file_bytes = [System.Convert]::FromBase64String("${{secrets.ANDROID_SIGNING_KEYSTORE_BASE64}}")
          [IO.File]::WriteAllBytes("${{secrets.ANDROID_SIGNING_KEYSTORE_FILENAME}}", $file_bytes)

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.SDK_VERSION}}

      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '11'     

      - name: Install MAUI Workloads
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Add Telerik NuGet Server
        run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}} 

      - name: Simple build MAUI Android
        run: |
          dotnet build ${{env.PROJECT_PATH}} -c Debug -f ${{env.NET_TFM}}-android

      # - name: Publish MAUI Android
      #   run: |
      #     dotnet publish ${{env.PROJECT_PATH}} -c Release -f ${{env.NET_TFM}}-android /p:AndroidKeyStore=true /p:AndroidSigningKeyStore=${{env.ANDROID_SIGNING_KEYSTORE_FILENAME}} /p:AndroidSigningStorePass=${{secrets.ANDROID_SIGNING_STORE_PASS}} /p:AndroidSigningKeyAlias=${{secrets.ANDROID_SIGNING_KEY_ALIAS}} /p:AndroidSigningKeyPass=${{secrets.ANDROID_SIGNING_KEY_PASS}}

      - name: Create artifacts folder
        run: |
           cd ${{github.workspace}}
           mkdir -p ${{env.ANDROID_ARTIFACTS_PATH}}

      - name: Copy signed APKs & AABs
        run: |
           Get-Childitem -Path ${{github.workspace}} -Include *Signed.apk -File -Recurse | Copy-Item -Destination ${{env.ANDROID_ARTIFACTS_PATH}}
           Get-Childitem -Path ${{github.workspace}} -Include *Signed.aab -File -Recurse | Copy-Item -Destination ${{env.ANDROID_ARTIFACTS_PATH}}

      # - name: Publish Android build artifacts
      #   uses: actions/upload-artifact@v3
      #   with:     
      #     name: "Android artifacts" 
      #     path: "${{env.ANDROID_ARTIFACTS_PATH}}/*"
      #     if-no-files-found: warn
      #     retention-days: 60

  # ********************************* #
  # >>>>>>> MacCatalyst build <<<<<<< #
  # ********************************* #
  build-macos:
    name: Build MacCatalyst
    needs: shared-resources
    if: ${{ success() && needs.shared-resources.outputs.app_version != '' }}
    runs-on: macos-26
    strategy:
      matrix:
        RID: [maccatalyst-arm64, maccatalyst-x64]
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{env.XCODE_VERSION}}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.SDK_VERSION}}

      - name: Install MAUI Workloads
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Add Telerik NuGet Server
        run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}}

      - name: Build MacCatalyst App
        run: |
          dotnet build ${{env.PROJECT_PATH}} -c Release -f ${{env.NET_TFM}}-maccatalyst -p:RuntimeIdentifier=${{matrix.RID}} -p:MtouchLink=SdkOnly

      - name: Create artifacts folder
        run: |
           cd ${{github.workspace}}
           mkdir -p ${{env.MACOS_ARTIFACTS_PATH}}
 
      - name: Copy MacOS packages
        run: Get-Childitem -Path ${{github.workspace}} -Include *.pkg -File -Recurse | Copy-Item -Destination ${{env.MACOS_ARTIFACTS_PATH}}

      # Docs https://github.com/Apple-Actions/import-codesign-certs
      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: "${{secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64}}"
          p12-password: "${{secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD}}"

      # Docs https://github.com/Apple-Actions/download-provisioning-profiles
      - uses: Apple-Actions/download-provisioning-profiles@v4
        id: provisioning
        with:
          profile-type: "${{env.APPLE_MAC_CODESIGN_PROFILE_TYPE}}"
          bundle-id: "${{env.APPLE_APP_ID}}"
          issuer-id: "${{secrets.APPSTORE_API_ISSUER_ID}}"
          api-key-id: "${{secrets.APPSTORE_API_KEY_ID}}"
          api-private-key: "${{secrets.APPSTORE_API_PRIVATE_KEY}}"

      # Docs https://learn.microsoft.com/en-us/dotnet/maui/mac-catalyst/deployment/?view=net-maui-10.0
      # Carefully follow the intructions about entitlements.plist and info.plist
      - name: Build MAUI MacCatalyst project
        run: |
          dotnet publish ${{env.PROJECT_PATH}} -c Release -f ${{env.NET_TFM}}-maccatalyst -p:RuntimeIdentifier=${{matrix.RID}}} -p:EnableCodeSigning=true -p:EnablePackageSigning=true -p:PublishTrimmed=true -p:MtouchLink=SdkOnly -p:ApplicationId="${{env.APPLE_APP_ID}}" -p:CodesignProvision="${{env.APPLE_MAC_CODESIGN_PROV_PROFILE}}" -p:CodesignKey=${{env.APPLE_CODESIGN_KEY}} -p:CodesignEntitlements=${{env.APPLE_CODESIGN_ENTITLEMENTS}}

      # Docs https://github.com/Apple-Actions/upload-testflight-build
      # - name: 'Upload app to TestFlight'
      #   uses: apple-actions/upload-testflight-build@v1
      #   with: 
      #     app-path: "${{github.workspace}}/**/*.pkg" 
      #     issuer-id: ${{secrets.APPSTORE_API_ISSUER_ID}}
      #     api-key-id: "${{secrets.APPSTORE_API_KEY_ID}}"
      #     api-private-key: "${{secrets.APPSTORE_API_PRIVATE_KEY}}"

      - name: Copy MacOS packages
        run: Get-Childitem -Path ${{github.workspace}} -Include *.pkg -File -Recurse | Copy-Item -Destination ${{env.MACOS_ARTIFACTS_PATH}}

      - name: Publish MacCatalyst build artifacts
        uses: actions/upload-artifact@v4
        with:     
          name: "HackedApp_v${{needs.shared-resources.outputs.app_version}}_${{matrix.RID}}.app" 
          path: "${{env.MACOS_ARTIFACTS_PATH}}/*"
          if-no-files-found: error
          retention-days: 30

  # ************************* #
  # >>>>>>> iOS build <<<<<<< #
  # ************************* #
  build-ios:
    runs-on: macos-latest
    needs: shared-resources
    if: ${{ success() && needs.shared-resources.outputs.app_version != '' }}
    env:
      RID: iossimulator-x64
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{env.XCODE_VERSION}}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.SDK_VERSION}}

      - name: Install MAUI Workloads
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Add Telerik NuGet Server
        run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}}

      - name: Build iOS App
        run: |
          dotnet build ${{env.PROJECT_PATH}} -f ${{env.NET_TFM}}-ios -c Debug -p:MtouchLink=SdkOnly -p:RuntimeIdentifier=${{env.RID}}
          # dotnet publish ${{env.PROJECT_PATH}} -f ${{env.NET_TFM}}-ios -c Release -p:BuildIpa=True

      # Docs https://github.com/Apple-Actions/import-codesign-certs
      # - name: Import Code-Signing Certificates
      #   uses: Apple-Actions/import-codesign-certs@v2
      #   with:
      #     p12-file-base64: "${{secrets.APPLE_DISTRIBUTION_CERT_BASE64}}"
      #     p12-password: "${{secrets.APPLE_DISTRIBUTION_CERT_PASSWORD}}"

      # Docs https://github.com/Apple-Actions/download-provisioning-profiles
      # - uses: Apple-Actions/download-provisioning-profiles@v2
      #   with:
      #     profile-type: "${{env.APPLE_PROV_PROFILE_TYPE}}"
      #     bundle-id: "${{env.APPLE_APP_ID}}"
      #     issuer-id: "${{secrets.APPSTORE_API_ISSUER_ID}}"
      #     api-key-id: "${{secrets.APPSTORE_API_KEY_ID}}"
      #     api-private-key: "${{secrets.APPSTORE_API_PRIVATE_KEY}}"
      #   env:
      #     APPLE_PROV_PROFILE: "Hacked_AdHoc_Distribution"
      #     APPLE_PROV_PROFILE_TYPE: "MAC_APP_STORE"

      # Docs https://learn.microsoft.com/en-us/dotnet/maui/ios/deployment/publish-cli?view=net-maui-9.0
      # - name: Build MAUI iOS project
      #   run: |
      #     dotnet publish ${{env.PROJECT_PATH}} -f ${{env.NET_TFM}}-ios -p:RuntimeIdentifier=${{env.RID}} -p:PublishTrimmed=true -p:MtouchLink=SdkOnly -p:ApplicationId=${{env.APP_ID}} -p:CodesignProvision=${{env.CODESIGN_PROV_PROFILE}} -p:CodesignKey=${{env.CODESIGN_KEY}}

      # Docs https://github.com/Apple-Actions/upload-testflight-build
      # - name: 'Upload app to TestFlight'
      #   uses: apple-actions/upload-testflight-build@v1
      #   with: 
      #     app-path: "${{github.workspace}}/**/*.ipa" 
      #     issuer-id: ${{secrets.APPSTORE_API_ISSUER_ID}}
      #     api-key-id: "${{secrets.APPSTORE_API_KEY_ID}}"
      #     api-private-key: "${{secrets.APPSTORE_API_PRIVATE_KEY}}"

