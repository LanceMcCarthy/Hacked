      #   run: |
      #      cd ${{github.workspace}}
      #      mkdir -p ${{github.workspace}}/${{env.MACOS_ARTIFACTS_PATH}}

      # - name: Copy MacCatalyst packages
      #   run: Get-Childitem -Path ${{github.workspace}} -Include *.app -File -Recurse | Copy-Item -Destination ${{github.workspace}}/${{env.MACOS_ARTIFACTS_PATH}}

