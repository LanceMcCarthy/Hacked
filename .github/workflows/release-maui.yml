name: Release .NET MAUI

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'src/Hacked.Maui/**/*'
  #     - '.github/workflows/release-maui.yml'

defaults:
  run:
    shell: pwsh

permissions:
  id-token: write  # For OIDC auth

env:
  PROJECT_PATH: "src/Hacked.Maui/Hacked.Maui.csproj"
  SDK_VERSION: '10.0.x'
  NET_TFM: 'net10.0'
  NUGET_CONFIG_PATH: 'src/nuget.config'
  TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
  TELERIK_LICENSE: ${{secrets.TELERIK_LICENSE_KEY_VALUE}}

jobs:
  # *********************************************************************************** #
  #                                   Shared Resources                                  #
  # *********************************************************************************** #
  shared-resources:
    name: Create Shared Resources
    runs-on: windows-latest
    outputs:
      app_version: ${{steps.version-creator.outputs.app_version}}
    steps:
    # Generates a version number using year.monthday.run_number (e.g., 2024.824.1)
    - name: Generate version number using date and run number
      id: version-creator
      shell: pwsh
      run: |
        $buildDay = Get-Date -Format "yyyy.Mdd"
        $runNumber = "$env:GITHUB_RUN_NUMBER"
        $ver = $buildDay + "." + $runNumber
        echo "app_version=$ver" >> $env:GITHUB_OUTPUT


  # ********************************************************************************** #
  #                                  Windows Sideload                                  #
  # ********************************************************************************** #
  maui-windows-sideload:
    name: Build Windows (Sideload)
    needs: shared-resources
    runs-on: windows-2022
    if: ${{ needs.shared-resources.outputs.app_version != ''}}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{env.SDK_VERSION}}

    # Needed only for WinUI builds
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Install MAUI workloads
      run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

    - name: Set Telerik NuGet Credentials
      run: dotnet nuget update source 'Telerik_v3_Feed' -s 'https://nuget.telerik.com/v3/index.json' -u 'api-key' -p "${{secrets.TELERIK_NUGET_KEY}}" --configfile '${{env.NUGET_CONFIG_PATH}}' --store-password-in-clear-text

    - name: Restore NuGet packages
      run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}}

    # Update the app manifest
    # We add an extra .0 to the end to satisfy the 4-segment version requirement (e.g., 2024.824.1.0)
    - name: Update manifest for side load build
      run: |
        [xml]$manifest = Get-Content 'src\Hacked.Maui\Platforms\Windows\Package.appxmanifest'
        $ns = $manifest.DocumentElement.NamespaceURI
        $nsmgr = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
        $nsmgr.AddNamespace('m', $ns)
        $identityNode = $manifest.SelectSingleNode('/m:Package/m:Identity', $nsmgr)
        if ($null -eq $identityNode) { throw 'Identity node not found in Package.appxmanifest' }
        $identityNode.SetAttribute('Version', "${{needs.shared-resources.outputs.app_version}}.0")
        $manifest.Save('src\Hacked.Maui\Platforms\Windows\Package.appxmanifest')

    - name: Build WinUI project and stage unsigned msixbundle
      id: build-sideload-package
      run: |
        $appxRoot = "${{github.workspace}}\artifacts\appx"
        $stagingRoot = "${{github.workspace}}\artifacts\signing"

        New-Item -ItemType Directory -Force -Path $appxRoot | Out-Null
        New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null

        $publishOutput = dotnet publish ${{env.PROJECT_PATH}} -c Release -f ${{env.NET_TFM}}-windows10.0.19041.0 -p:AppxPackageSigningEnabled=false -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxBundle=Always "-p:AppxBundlePlatforms=x64|arm64" -p:PlatformTarget=AnyCPU -p:AppxPackageDir="${appxRoot}\" 2>&1
        $publishOutput | ForEach-Object { Write-Host $_ }

        $packagePath = $null
        $bundleLine = $publishOutput |
          Where-Object { $_ -match '\.msixbundle' } |
          Select-Object -Last 1

        if ($bundleLine -and $bundleLine -match '(?<path>[A-Za-z]:\\[^\r\n]*?\.msixbundle)') {
          $candidate = $matches['path']
          if (Test-Path $candidate) {
            $packagePath = $candidate
            Write-Host "Using .msixbundle from publish output: $packagePath"
          } else {
            Write-Host "Publish log reported a .msixbundle path, but file is not present at copy time: $candidate"
          }
        }

        if (-not $packagePath) {
          $packagePath = Get-ChildItem -Path $appxRoot -Recurse -Force -File |
            Where-Object { $_.Extension -ieq '.msixbundle' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -ExpandProperty FullName -First 1
        }

        if (-not $packagePath) {
          Write-Host "No .msixbundle files remained under $appxRoot after publish; falling back to .msix output."
          $packagePath = Get-ChildItem -Path $appxRoot -Recurse -Force -File |
            Where-Object { $_.Extension -ieq '.msix' -and $_.Name -notlike '*Microsoft.WindowsAppRuntime*' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -ExpandProperty FullName -First 1
        }

        if (-not $packagePath) {
          Write-Host "No .msixbundle or .msix files found under $appxRoot after publish. Listing package directory contents for diagnostics:"
          Get-ChildItem -Path $appxRoot -Recurse -Force | Format-List -Property FullName, Length, Attributes
          throw "No .msixbundle or .msix files found under $appxRoot after publish."
        }

        $stagedPackagePath = Join-Path $stagingRoot (Split-Path $packagePath -Leaf)
        Copy-Item -Path $packagePath -Destination $stagedPackagePath -Force

        Write-Host "Selected package for signing: $packagePath"
        Write-Host "Staged package: $stagedPackagePath"
        "bundle_path=$stagedPackagePath" >> $env:GITHUB_OUTPUT

    # Entra ID App Registration (Akeyless OIDC Provider) > Certificates and Secrets > Federated Credentials
    - name: Azure login using OIDC via GitHub
      uses: azure/login@v2
      id: azlogin
      with:
        client-id: "32daa13b-f4bb-4809-8ef6-58cb39051acd"
        tenant-id: "bd47e796-3473-4b8a-9101-1f4c0c7af31a"
        subscription-id: "48ab4839-62af-4ab3-afe6-043ea4d7c137"

    - name: Sign files with Trusted Signing
      uses: azure/trusted-signing-action@v1.2.0
      with:
        endpoint: https://eus.codesigning.azure.net/
        signing-account-name: PrimaryCodeSign
        certificate-profile-name: lancemccarthylivepublic
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        file-digest: SHA256
        files: ${{steps.build-sideload-package.outputs.bundle_path}}
        exclude-azure-cli-credential: false
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    - name: Attach artifacts to workflow run
      uses: actions/upload-artifact@v4
      with:     
        name: "Hacked_v${{needs.shared-resources.outputs.app_version}}_sideload"
        path: ${{steps.build-sideload-package.outputs.bundle_path}}
        if-no-files-found: error
        retention-days: 30


  # ***************************************************************************************** #
  #                                  Windows Microsoft Store                                  #
  # ***************************************************************************************** #
  build-windows:
    name: Build Windows (Store Upload)
    runs-on: windows-latest
    needs: shared-resources
    if: ${{ success() && needs.shared-resources.outputs.app_version != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.SDK_VERSION}}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Install MAUI Workloads
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Add Telerik NuGet Server
        run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}}

      - name: Build Maui WinUI project
        run: dotnet publish ${{env.PROJECT_PATH}} -c Release -f ${{env.NET_TFM}}-windows10.0.19041.0 -p:AppxPackageSigningEnabled=false -p:AppxSymbolPackageEnabled=false -p:UapAppxPackageBuildMode=StoreUpload -p:AppxBundle=Always "-p:AppxBundlePlatforms=x64|arm64" -p:PlatformTarget=AnyCPU

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:     
          name: "Hacked_v${{needs.shared-resources.outputs.app_version}}_storeupload"
          path: "**/*.msixupload"
          if-no-files-found: error
          retention-days: 60


  # ***************************************************************************************** #
  #                                      MacCatalyst                                          #
  # ***************************************************************************************** #
  build-macos:
    name: Build MacCatalyst (Signed & Notiarized)
    needs: shared-resources
    if: ${{ success() && needs.shared-resources.outputs.app_version != '' }}
    runs-on: macos-26
    env:
      XCODE_VERSION: '26.3'
      APPLE_DEV_ID_APP_CERT_NAME: "Developer ID Application: Lancelot Software, LLC (L65255N3F7)"
      APPLE_DEV_ID_INSTALLER_CERT_NAME: "Developer ID Installer: Lancelot Software, LLC (L65255N3F7)"
      APPLE_NOTARY_TEAM_ID: "L65255N3F7"
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{env.XCODE_VERSION}}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.SDK_VERSION}}

      - name: Install MAUI Workloads
        run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

      - name: Set Telerik NuGet Credentials
        run: dotnet nuget update source 'Telerik_v3_Feed' -s 'https://nuget.telerik.com/v3/index.json' -u 'api-key' -p "${{secrets.TELERIK_NUGET_KEY}}" --configfile '${{env.NUGET_CONFIG_PATH}}' --store-password-in-clear-text

      - name: Restore NuGet packages
        run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}}

      - name: Import Developer ID Installer Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: "${{secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_BASE64}}"
          p12-password: "${{secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD}}"
          keychain: installer_signing_temp

      - name: Import Developer ID Application Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: "${{secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64}}"
          p12-password: "${{secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD}}"
          keychain: application_signing_temp

      - name: Ensure both signing keychains are in the search list
        shell: bash
        run: |
          # Each import-codesign-certs call rewrites the keychain search list.
          # The second call (Application cert) drops the first (Installer) keychain,
          # so productbuild cannot find the "Developer ID Installer" identity.
          # Re-add both keychains explicitly before any signing occurs.
          INSTALLER_KC="$HOME/Library/Keychains/installer_signing_temp.keychain-db"
          APP_KC="$HOME/Library/Keychains/application_signing_temp.keychain-db"
          security list-keychains -d user -s "$INSTALLER_KC" "$APP_KC" login.keychain
          echo "Keychain search list:"
          security list-keychains -d user

      - name: Verify Developer ID identities are available
        shell: bash
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning
          security find-certificate -a -c "${{env.APPLE_DEV_ID_INSTALLER_CERT_NAME}}" || true

          if ! security find-identity -v -p codesigning | grep -F "${{env.APPLE_DEV_ID_APP_CERT_NAME}}" >/dev/null; then
            echo "Missing Developer ID Application identity: ${{env.APPLE_DEV_ID_APP_CERT_NAME}}"
            exit 1
          fi

          if ! security find-certificate -a -c "${{env.APPLE_DEV_ID_INSTALLER_CERT_NAME}}" >/dev/null; then
            echo "Missing Developer ID Installer certificate: ${{env.APPLE_DEV_ID_INSTALLER_CERT_NAME}}"
            exit 1
          fi

      - name: Build, sign, notarize, and staple MacCatalyst artifacts
        shell: bash
        env:
          PROJECT_PATH: ${{env.PROJECT_PATH}}
          TFM: ${{env.NET_TFM}}-maccatalyst
          CONFIGURATION: Release
          APP_VERSION: ${{needs.shared-resources.outputs.app_version}}
          CODESIGN_KEY: ${{env.APPLE_DEV_ID_APP_CERT_NAME}}
          INSTALLER_SIGN_ID: ${{env.APPLE_DEV_ID_INSTALLER_CERT_NAME}}
          APPLE_NOTARY_APPLE_ID: ${{secrets.APPLE_NOTARY_APPLE_ID}}
          APPLE_NOTARY_APP_PASSWORD: ${{secrets.APPLE_NOTARY_APP_PASSWORD}}
          APPLE_NOTARY_TEAM_ID: ${{env.APPLE_NOTARY_TEAM_ID}}
        run: |
          ./scripts/maccatalyst/build-sign-notarize.sh

      - name: Publish MacCatalyst build artifacts
        uses: actions/upload-artifact@v7
        with:     
          name: "HackedApp_v${{needs.shared-resources.outputs.app_version}}_maccatalyst_notarized"
          path: |
            artifacts/maccatalyst/Hacked-MacCatalyst-Release-signed.pkg
            artifacts/maccatalyst/Hacked-MacCatalyst-Release-notarized.zip
            src/Hacked.Maui/bin/Release/net10.0-maccatalyst/Hacked.app
          if-no-files-found: error
          retention-days: 30


