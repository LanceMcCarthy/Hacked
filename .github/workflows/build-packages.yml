name: Build Packages

on:
  workflow_dispatch:
  push:
    branches:
      - 'releases/uno-v*'
    paths:
      - 'src/Hacked.Uno/**'
      - 'src/Hacked.Maui/**'
      - 'src/Hacked.Core/**'
      - 'src/Hacked.Services/**'
      - '.github/workflows/build-packages.yml'

env:
  BLD_CONFIG: 'Release'
  DOTNET_VERSION: '9.0.x'
  MAUI_DOTNET_VERSION: '10.0.x'
  NUGET_CONFIG: 'src/nuget.config'
  MACCATALYST_TFM: 'net9.0-maccatalyst'
  MAUI_MACCATALYST_TFM: 'net10.0-maccatalyst'
  MAUI_PROJECT_PATH: 'src/Hacked.Maui/Hacked.Maui.csproj'
  XCODE_VERSION: '26.2'
  IOS_TFM: 'net9.0-ios'
  WINDOWS_TFM: 'net9.0-windows10.0.19041'
  ANDROID_TFM: 'net9.0-android'

jobs:
  shared-resources:
    name: Create Shared Resources
    runs-on: windows-latest
    outputs:
      app_version: ${{steps.version-creator.outputs.app_version}}
    steps:
    # Generates a version number using year.monthday.run_number.0 (e.g., 2024.824.1.0)
    - name: Generate version number using date and run number
      id: version-creator
      run: |
        $buildDay = Get-Date -Format "yyyy.Mdd"
        $runNumber = "$env:GITHUB_RUN_NUMBER"
        $ver = $buildDay + "." + $runNumber + ".0"
        echo "app_version=$ver" >> $env:GITHUB_OUTPUT
  
  # ── macOS / macCatalyst ────────────────────────────────────────────────────
  build-macos:
    name: macOS package (${{matrix.runtime}})
    runs-on: macos-latest
    needs: shared-resources
    if: ${{ success() && needs.shared-resources.outputs.app_version != '' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [maccatalyst-x64, maccatalyst-arm64]
    env:
      TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET ${{env.DOTNET_VERSION}}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{env.XCODE_VERSION}}

      - name: Install workloads
        run: dotnet workload install maccatalyst --skip-sign-check

      - name: Restore shared libs
        run: |
          dotnet restore src/Hacked.Core/Hacked.Core.csproj --configfile ${{env.NUGET_CONFIG}} --nologo
          dotnet restore src/Hacked.Services/Hacked.Services.csproj --configfile ${{env.NUGET_CONFIG}} --nologo

      - name: Restore macCatalyst
        run: >
          dotnet restore src/Hacked.Uno/Hacked/Hacked.csproj
          --no-dependencies
          -p:TargetFramework=${{env.MACCATALYST_TFM}}
          -r ${{matrix.runtime}}
          --configfile ${{env.NUGET_CONFIG}}
          --nologo

      - name: Publish macCatalyst
        run: >
          dotnet publish src/Hacked.Uno/Hacked/Hacked.csproj
          -c ${{env.BLD_CONFIG}}
          -f ${{env.MACCATALYST_TFM}}
          -r ${{matrix.runtime}}
          -p:Version=${{needs.shared-resources.outputs.app_version}}
          -p:ApplicationDisplayVersion=${{needs.shared-resources.outputs.app_version}}
          -p:CodesignKey=""
          -p:CodesignProvision=""
          --no-restore
          --nologo

      - name: Locate .app bundle
        id: find_app
        run: |
          APP=$(find src/Hacked.Uno/Hacked/bin/Release/net9.0-maccatalyst/${{matrix.runtime}} -name "*.app" -maxdepth 3 | head -1)
          echo "app_path=$APP" >> $GITHUB_OUTPUT
          echo "Found: $APP"

      - name: Zip .app for download
        run: |
          cd "$(dirname "${{steps.find_app.outputs.app_path}}")"
          zip -r Hacked-Uno-macOS-${{needs.shared-resources.outputs.app_version}}-${{matrix.runtime}}.zip "$(basename "${{steps.find_app.outputs.app_path}}")"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: hacked-uno-macos-${{needs.shared-resources.outputs.app_version}}-${{matrix.runtime}}
          path: src/Hacked.Uno/Hacked/bin/Release/net9.0-maccatalyst/${{matrix.runtime}}/**/Hacked-Uno-macOS-${{needs.shared-resources.outputs.app_version}}-${{matrix.runtime}}.zip
          retention-days: 14

  # ── macOS / macCatalyst (.NET MAUI) ───────────────────────────────────────
  build-macos-maui:
    name: MAUI macOS package (${{matrix.runtime}})
    runs-on: macos-latest
    needs: shared-resources
    if: ${{ success() && needs.shared-resources.outputs.app_version != '' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [maccatalyst-x64, maccatalyst-arm64]
    env:
      TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET ${{env.MAUI_DOTNET_VERSION}}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.MAUI_DOTNET_VERSION}}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{env.XCODE_VERSION}}

      - name: Install workloads
        run: dotnet workload install maui maccatalyst --skip-sign-check

      - name: Restore shared libs
        run: |
          dotnet restore src/Hacked.Core/Hacked.Core.csproj --configfile ${{env.NUGET_CONFIG}} --nologo
          dotnet restore src/Hacked.Services/Hacked.Services.csproj --configfile ${{env.NUGET_CONFIG}} --nologo

      - name: Restore MAUI macCatalyst
        run: >
          dotnet restore ${{env.MAUI_PROJECT_PATH}}
          --no-dependencies
          -p:TargetFramework=${{env.MAUI_MACCATALYST_TFM}}
          -r ${{matrix.runtime}}
          --configfile ${{env.NUGET_CONFIG}}
          --nologo

      - name: Publish MAUI macCatalyst
        run: >
          dotnet publish ${{env.MAUI_PROJECT_PATH}}
          -c ${{env.BLD_CONFIG}}
          -f ${{env.MAUI_MACCATALYST_TFM}}
          -r ${{matrix.runtime}}
          -p:Version=${{needs.shared-resources.outputs.app_version}}
          -p:ApplicationDisplayVersion=${{needs.shared-resources.outputs.app_version}}
          -p:CodesignKey=""
          -p:CodesignProvision=""
          --no-restore
          --nologo

      - name: Locate MAUI .app bundle
        id: find_maui_app
        run: |
          APP=$(find src/Hacked.Maui/bin/Release/net10.0-maccatalyst/${{matrix.runtime}} -name "*.app" -maxdepth 3 | head -1)
          echo "app_path=$APP" >> $GITHUB_OUTPUT
          echo "Found: $APP"

      - name: Zip MAUI .app for download
        run: |
          cd "$(dirname "${{steps.find_maui_app.outputs.app_path}}")"
          zip -r Hacked-MAUI-macOS-${{needs.shared-resources.outputs.app_version}}-${{matrix.runtime}}.zip "$(basename "${{steps.find_maui_app.outputs.app_path}}")"

      - name: Upload MAUI macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: hacked-maui-macos-${{needs.shared-resources.outputs.app_version}}-${{matrix.runtime}}
          path: src/Hacked.Maui/bin/Release/net10.0-maccatalyst/${{matrix.runtime}}/**/Hacked-MAUI-macOS-${{needs.shared-resources.outputs.app_version}}-${{matrix.runtime}}.zip
          retention-days: 14

  create-preview-release:
    name: Create Preview Release
    runs-on: ubuntu-latest
    needs:
      - shared-resources
      - build-macos
      - build-macos-maui
    if: ${{ success() && needs.shared-resources.outputs.app_version != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hacked-uno-macos-${{needs.shared-resources.outputs.app_version}}-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: hacked-maui-macos-${{needs.shared-resources.outputs.app_version}}-*
          path: release-assets
          merge-multiple: true

      - name: Create install README
        run: |
          cat << 'EOF' > release-assets/README-macOS-install.txt
          Hacked macOS Preview Installation

          1. Download the ZIP matching your Mac architecture:
             - maccatalyst-arm64 for Apple Silicon (M1/M2/M3)
             - maccatalyst-x64 for Intel Macs

           2. Open the ZIP and drag Hacked.app to /Applications.

           3. Remove the quarantine attribute (internet download flag):
             xattr -dr com.apple.quarantine /Applications/Hacked.app

           4. First launch (unsigned preview build):
             - Right-click Hacked.app and select Open.
             - Click Open again in the warning dialog.

           5. If macOS blocks launch, open System Settings > Privacy & Security,
             then allow the app and launch again.
          EOF

      - name: Create preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-v${{needs.shared-resources.outputs.app_version}}
          name: Hacked Preview v${{needs.shared-resources.outputs.app_version}}
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Preview macOS package build for Hacked.

            Included artifacts:
            - Uno macCatalyst arm64 package
            - Uno macCatalyst x64 package
            - MAUI macCatalyst arm64 package
            - MAUI macCatalyst x64 package

            Install quick steps:
            1. Download the ZIP for your CPU architecture and copy Hacked.app to /Applications.
            2. Remove the internet quarantine flag:
               `xattr -dr com.apple.quarantine /Applications/Hacked.app`
            3. Launch the app (right-click > Open on first launch if prompted).

            See README-macOS-install.txt in release assets for full install steps.
          files: |
            release-assets/*.zip
            release-assets/README-macOS-install.txt
