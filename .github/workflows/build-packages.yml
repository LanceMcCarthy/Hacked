name: Build Test Packages

on:
  workflow_dispatch:

env:
  BLD_CONFIG: 'Release'
  DOTNET_VERSION: '9.0.x'
  NUGET_CONFIG: 'src/nuget.config'
  XCODE_VERSION: '16.2'
  MACCATALYST_TFM: 'net9.0-maccatalyst'

jobs:
  # ── macOS / macCatalyst ────────────────────────────────────────────────────
  build-macos:
    name: macOS package (net9.0-maccatalyst)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install workloads
        run: dotnet workload install maccatalyst --skip-sign-check

      - name: Restore shared libs
        run: |
          dotnet restore src/Hacked.Core/Hacked.Core.csproj --configfile ${{ env.NUGET_CONFIG }} --nologo
          dotnet restore src/Hacked.Services/Hacked.Services.csproj --configfile ${{ env.NUGET_CONFIG }} --nologo

      - name: Restore Hacked (macCatalyst TFM only)
        run: >
          dotnet restore src/Uno/Hacked/Hacked.csproj
          --no-dependencies
          -p:TargetFramework=${{ env.MACCATALYST_TFM }}
          --configfile ${{ env.NUGET_CONFIG }}
          --nologo

      - name: Publish macCatalyst
        run: >
          dotnet publish src/Uno/Hacked/Hacked.csproj
          -c ${{ env.BLD_CONFIG }}
          -f ${{ env.MACCATALYST_TFM }}
          -p:RuntimeIdentifier=maccatalyst-x64
          -p:CodesignKey=""
          -p:CodesignProvision=""
          --no-restore
          --nologo

      - name: Locate .app bundle
        id: find_app
        run: |
          APP=$(find src/Uno/Hacked/bin/Release/net9.0-maccatalyst -name "*.app" -maxdepth 3 | head -1)
          echo "app_path=$APP" >> $GITHUB_OUTPUT
          echo "Found: $APP"

      - name: Zip .app for download
        run: |
          cd "$(dirname "${{ steps.find_app.outputs.app_path }}")"
          zip -r Hacked-macOS.zip "$(basename "${{ steps.find_app.outputs.app_path }}")"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hacked-macos
          path: src/Uno/Hacked/bin/Release/net9.0-maccatalyst/**/Hacked-macOS.zip
          retention-days: 14
