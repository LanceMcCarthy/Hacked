name: Build .NET MAUI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/Hacked.Maui/**/*'
      - '.github/workflows/build-maui.yml'

env:
  PROJECT_PATH: "src/Hacked.Maui/Hacked.maui.csproj"
  NET_TFM: 'net10.0'
  TELERIK_LICENSE: ${{secrets.TELERIK_LICENSE_KEY_VALUE}}

jobs:
  maui-smoketest:
    name: Build (${{matrix.name}})
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Android"
            os: windows-latest
            tfm: "net10.0-android"
            xcode_version: 'null'
            dotnet_version: '10.0.x'
          - name: "WinUI"
            os: windows-latest
            tfm: "net10.0-windows10.0.19041.0"
            xcode_version: 'null'
            dotnet_version: '10.0.x'
          - name: "iOS"
            os: macos-26
            tfm: "net10.0-ios"
            xcode_version: '26.5'
            dotnet_version: '10.0.x'
          - name: "MacCatalyst"
            os: macos-26
            tfm: "net10.0-maccatalyst"
            xcode_version: '26.5'
            dotnet_version: '10.0.x'
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{matrix.dotnet_version}}

    # Only needed for WinUI builds
    - name: Add msbuild to PATH
      if: matrix.name == 'WinUI'
      uses: microsoft/setup-msbuild@v3

    - uses: actions/setup-java@v5
      if: matrix.name == 'Android'
      with:
        distribution: 'microsoft'
        java-version: '11'

    - uses: maxim-lobanov/setup-xcode@v1
      if: matrix.name == 'iOS' || matrix.name == 'MacCatalyst'
      with:
        xcode-version: ${{matrix.xcode_version}}

    - name: Install MAUI workloads
      run: dotnet workload install maui

    - name: Create ghost settings file so debug smoketest works in CI
      run: touch src/Hacked.Maui/appsettings.Development.json

    - name: Create build args
      id: arg-builder
      shell: pwsh
      run: |
        $buildArgs = @(
          '${{env.PROJECT_PATH}}'
          '-c', 'Debug'
          '-f', '${{matrix.tfm}}'
        )

        if ('${{matrix.name}}' -in @('iOS', 'MacCatalyst')) {
          $buildArgs += @(
            '-p:MtouchLink=SdkOnly'
          )
        }

        "args=$($buildArgs -join ' ')" >> $env:GITHUB_OUTPUT

    - name: Build project
      run: dotnet build ${{steps.arg-builder.outputs.args}}
