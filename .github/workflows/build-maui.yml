      #     api-key-id: "${{secrets.APPSTORE_API_KEY_ID}}"
      #     api-private-key: "${{secrets.APPSTORE_API_PRIVATE_KEY}}"
      #   env:
      #     APPLE_PROV_PROFILE: "Hacked_AdHoc_Distribution"
      #     APPLE_PROV_PROFILE_TYPE: "MAC_APP_STORE"

      # Docs https://learn.microsoft.com/en-us/dotnet/maui/ios/deployment/publish-cli?view=net-maui-9.0
      # - name: Build MAUI iOS project
      #   run: |
      #     dotnet publish ${{env.PROJECT_PATH}} -f ${{env.NET_TFM}}-ios -p:RuntimeIdentifier=${{env.RID}} -p:PublishTrimmed=true -p:MtouchLink=SdkOnly -p:ApplicationId=${{env.APP_ID}} -p:CodesignProvision=${{env.CODESIGN_PROV_PROFILE}} -p:CodesignKey=${{env.CODESIGN_KEY}}

      # Docs https://github.com/Apple-Actions/upload-testflight-build
