name: Build Common

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/Hacked.Core/**/*'
      - 'src/Hacked.Services/**/*'
      - '.github/workflows/build-common.yml'

env:
  CORE_PROJECT_PATH: 'src/Hacked.Core/Hacked.Core.csproj'
  SERVICES_PROJECT_PATH: 'src/Hacked.Services/Hacked.Services.csproj'

jobs:
  smoke-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Add Telerik NuGet Server
      run: dotnet nuget add source 'https://nuget.telerik.com/v3/index.json' -n "TelerikNuGetServer" -u ${{secrets.MyTelerikAccountUsername}} -p ${{secrets.MyTelerikAccountPassword}} --store-password-in-clear-text

    - name: Restore NuGet Packages
      run: |
        dotnet restore ${{env.SERVICES_PROJECT_PATH}} 

    - name: Build Services
      run: dotnet build ${{env.SERVICES_PROJECT_PATH}} -c Debug --no-restore
