name: Build Common

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/Hacked.Core/**/*'
      - 'src/Hacked.Services/**/*'
      - '.github/workflows/build-common.yml'

env:
  CORE_PROJECT_PATH: 'src/Hacked.Core/Hacked.Core.csproj'
  SERVICES_PROJECT_PATH: "src/Hacked.Services/Hacked.Services.csproj"
  NUGETCONFIG_PATH: "src/nuget.config"

jobs:
  windows-build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
    
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.1
      with:
        msbuild-architecture: x64
      
    - name: NuGet Restore
      run: |
        nuget restore ${{ env.SERVICES_PROJECT_PATH }} --configfile ${{ env.NUGETCONFIG_PATH }}
      env:
          TELERIK_USERNAME: ${{ secrets.MyTelerikAccountUsername }}
          TELERIK_PASSWORD: ${{ secrets.MyTelerikAccountPassword }} 
  
    - name: Build Services
      run: msbuild ${{ env.SERVICES_PROJECT_PATH }} /p:Platform=x64 /p:Configuration=Debug
