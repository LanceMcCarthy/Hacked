name: Build UWP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/Hacked/**/*'
      - 'src/Hacked.BackgroundTasks/**/*'
      - '.github/workflows/build-uwp.yml'

env:
  SOLUTION_PATH: 'src/Hacked_Uwp.sln'
  PROJECT_PATH: 'src/Hacked/Hacked.csproj'
  Configuration: Debug
  TargetPlatform: x64
  BuildMode: CI
  AppxBundle: Never
  AppxPackageSigningEnabled: False

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.3.2
      with:
        msbuild-architecture: x64
      
    - name: Add Telerik NuGet Server
      run: dotnet nuget add source 'https://nuget.telerik.com/v3/index.json' -n "TelerikNuGetServer" -u ${{secrets.MyTelerikAccountUsername}} -p ${{secrets.MyTelerikAccountPassword}} --store-password-in-clear-text

    - name: Add Telerik NuGet Server
      run: dotnet restore ${{env.SOLUTION_PATH}}

    - name: Build UWP Solution
      run: msbuild ${{env.SOLUTION_PATH}} /p:Configuration=${{env.Configuration}} /p:Platform=${{env.TargetPlatform}} /p:UapAppxPackageBuildMode=${{env.BuildMode}} /p:AppxBundle=${{env.AppxBundle}} /p:AppxPackageSigningEnabled=${{env.AppxPackageSigningEnabled}}
