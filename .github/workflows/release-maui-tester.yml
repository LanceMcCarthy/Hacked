name: Release .NET MAUI (tester)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-maui-tester.yml'
  # pull_request:
  #   types: []  # Explicitly disabled - external PRs cannot trigger this workflow

defaults:
  run:
    shell: pwsh

env:
  PROJECT_PATH: "src/Hacked.Maui/Hacked.Maui.csproj"
  SDK_VERSION: '10.0.x'
  NET_TFM: 'net10.0'
  NUGET_CONFIG_PATH: 'src/nuget.config'
  TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
  TELERIK_LICENSE: ${{secrets.TELERIK_LICENSE_KEY_VALUE}}

jobs:
  maui-windows-sideload:
    name: Build Windows (Sideload)
    runs-on: [self-hosted, x64, digicert-enabled]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Generate version number using date and run number
      id: version-creator
      shell: pwsh
      run: |
        $buildDay = Get-Date -Format "yyyy.Mdd"
        $runNumber = "$env:GITHUB_RUN_NUMBER"
        $ver = $buildDay + "." + $runNumber
        echo "app_version=$ver" >> $env:GITHUB_OUTPUT

    - name: Set Telerik NuGet Credentials
      run: dotnet nuget update source 'Telerik_v3_Feed' -s 'https://nuget.telerik.com/v3/index.json' -u 'api-key' -p "${{secrets.TELERIK_NUGET_KEY}}" --configfile '${{env.NUGET_CONFIG_PATH}}' --store-password-in-clear-text

    - name: Restore NuGet packages
      run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}}

    - name: Set API Key
      run: |
        $file = 'src/Hacked.Maui/appsettings.json'
        $config = Get-Content $file -Raw | ConvertFrom-Json
        $config.HibpApiKey = $env:HIBP_API_KEY
        $config | ConvertTo-Json -Depth 10 | Set-Content -Path $file -Encoding utf8NoBOM
      env:
        HIBP_API_KEY: ${{secrets.HIBP_API_KEY}}
          
    - name: Build WinUI project and stage unsigned msixbundle
      id: build-sideload-package
      run: |
        # Unlock certificate using  SafeNet authentication client (USB hardware token must be plugged in)
        $sacTools = "C:\Program Files\SafeNet\Authentication\SAC\x64\SACTools.exe"
        & $sacTools /Token /LogOn /Password "${{secrets.DIGICERT_HARDWARE_TOKEN_PASSWORD}}"

        $thumbprint = "8BC202959D2DCE3EEB3A489D8348B5C9B6B64A97"
        $subjectName = (Get-Item "Cert:\CurrentUser\My\$thumbprint").Subject
        $subjectNameForMsBuild = $subjectName.Replace(',', '%2c').Replace(';', '%3b')
        $appVersion = "${{steps.version-creator.outputs.app_version}}.0"
        $artifactDir = "${{github.workspace}}\artifacts"
        $bundleDir = "$artifactDir\bundle"
        
        New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null

        # Publish x64
        Write-Host "Publishing x64..."
        $publishArgsX64 = @(
          'publish'
          '${{env.PROJECT_PATH}}'
          '-c', 'Release'
          '-f', '${{env.NET_TFM}}-windows10.0.19041.0'
          '-p:AppxPackageSigningEnabled=true'
          '-p:UapAppxPackageBuildMode=SideloadOnly'
          '-p:AppxBundle=Never'
          '-p:PlatformTarget=x64'
          "-p:PackageCertificateThumbprint=$thumbprint"
          "-p:AppxPackageCertificateSubjectName=$subjectNameForMsBuild"
          "-p:AppxPackageVersion=$appVersion"
          '-p:AppxPublisherDisplayName=Lancelot Software'
        )
        & dotnet @publishArgsX64
        
        $msixX64 = Get-ChildItem -Filter Hacked*.msix -Recurse | Where-Object { $_.FullName -notlike '*arm64*' } | Select-Object -ExpandProperty FullName -First 1
        if (-not $msixX64) { throw "No x64 .msix found after publish" }
        Write-Host "Found x64 package: $msixX64"
        Copy-Item -Path $msixX64 -Destination "$bundleDir\Hacked.x64.msix" -Force

        # Publish arm64
        Write-Host "Publishing arm64..."
        $publishArgsArm64 = @(
          'publish'
          '${{env.PROJECT_PATH}}'
          '-c', 'Release'
          '-f', '${{env.NET_TFM}}-windows10.0.19041.0'
          '-p:AppxPackageSigningEnabled=true'
          '-p:UapAppxPackageBuildMode=SideloadOnly'
          '-p:AppxBundle=Never'
          '-p:PlatformTarget=arm64'
          "-p:PackageCertificateThumbprint=$thumbprint"
          "-p:AppxPackageCertificateSubjectName=$subjectNameForMsBuild"
          "-p:AppxPackageVersion=$appVersion"
          '-p:AppxPublisherDisplayName=Lancelot Software'
        )
        & dotnet @publishArgsArm64
        
        $msixArm64 = Get-ChildItem -Filter Hacked*.msix -Recurse | Where-Object { $_.FullName -like '*arm64*' } | Select-Object -ExpandProperty FullName -First 1
        if (-not $msixArm64) { throw "No arm64 .msix found after publish" }
        Write-Host "Found arm64 package: $msixArm64"
        Copy-Item -Path $msixArm64 -Destination "$bundleDir\Hacked.arm64.msix" -Force

        # Create bundle using MakeAppx
        Write-Host "Creating msixbundle from x64 and arm64 packages..."
        $bundlePath = "$bundleDir\Hacked.$appVersion.msixbundle"
        $makeappx = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\MakeAppx.exe"
        & $makeappx bundle /d "$bundleDir" /p $bundlePath
        
        if (-not (Test-Path $bundlePath)) { throw "Failed to create msixbundle at $bundlePath" }
        Write-Host "Created bundle: $bundlePath"
        
        echo "PACKAGE_PATH=$bundlePath" >> $env:GITHUB_OUTPUT

    - name: Locate msixbundle
      id: find-msix-file
      run: |
        $bundlePath = "${{steps.build-sideload-package.outputs.PACKAGE_PATH}}"
        if (-not (Test-Path $bundlePath)) { throw "msixbundle not found at $bundlePath" }
        echo "PACKAGE_PATH=$bundlePath" >> $env:GITHUB_OUTPUT

    # - name: Use hardware token and sign with digicert certificate
    #   run: |
    #     # Launch SafeNet authentication client (USB hardware token must be plugged in)
    #     # Unlock token via SafeNet's PKCS#11 interface; this will prompt for PIN entry if token is locked
    #     $sacTools = "C:\Program Files\SafeNet\Authentication\SAC\x64\SACTools.exe"
    #     & $sacTools /Token /LogOn /Password "${{secrets.DIGICERT_HARDWARE_TOKEN_PASSWORD}}"

    #     # Now the cert is ready to be used for signing. Sign the package with a timestamp.
    #     $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
    #     & $signtool sign /sha1 8BC202959D2DCE3EEB3A489D8348B5C9B6B64A97 `
    #       /fd sha256 `
    #       /tr http://timestamp.digicert.com `
    #       /td sha256 `
    #       "${{steps.build-sideload-package.outputs.bundle_path}}"

    - name: Attach artifacts to workflow run
      uses: actions/upload-artifact@v7
      with:     
        name: "Hacked_v${{steps.version-creator.outputs.app_version}}_x64_arm64"
        path: ${{steps.find-msix-file.outputs.PACKAGE_PATH}}
        if-no-files-found: error
        retention-days: 30
