name: Release .NET MAUI (tester)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-maui-tester.yml'
  # pull_request:
  #   types: []  # Explicitly disabled - external PRs cannot trigger this workflow

defaults:
  run:
    shell: pwsh

env:
  PROJECT_PATH: "src/Hacked.Maui/Hacked.Maui.csproj"
  SDK_VERSION: '10.0.x'
  NET_TFM: 'net10.0'
  NUGET_CONFIG_PATH: 'src/nuget.config'
  TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
  TELERIK_LICENSE: ${{secrets.TELERIK_LICENSE_KEY_VALUE}}

jobs:
  # *********************************************************************************** #
  #                                   Shared Resources                                  #
  # *********************************************************************************** #
  shared-resources:
    name: Create Shared Resources
    runs-on: windows-latest
    outputs:
      app_version: ${{steps.version-creator.outputs.app_version}}
    steps:
    # Generates a version number using year.monthday.run_number (e.g., 2024.824.1)
    - name: Generate version number using date and run number
      id: version-creator
      shell: pwsh
      run: |
        $buildDay = Get-Date -Format "yyyy.Mdd"
        $runNumber = "$env:GITHUB_RUN_NUMBER"
        $ver = $buildDay + "." + $runNumber
        echo "app_version=$ver" >> $env:GITHUB_OUTPUT

  # ********************************************************************************** #
  #                                  Windows Sideload                                  #
  # ********************************************************************************** #
  maui-windows-sideload:
    name: Build Windows (${{ matrix.arch }})
    needs: shared-resources
    runs-on: [self-hosted, x64, digicert-enabled]
    strategy:
      matrix:
        include:
          - arch: x64
            platform_target: x64
            runtime_id: win-x64
          - arch: arm64
            platform_target: arm64
            runtime_id: win-arm64
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set Telerik NuGet Credentials
      run: dotnet nuget update source 'Telerik_v3_Feed' -s 'https://nuget.telerik.com/v3/index.json' -u 'api-key' -p "${{secrets.TELERIK_NUGET_KEY}}" --configfile '${{env.NUGET_CONFIG_PATH}}' --store-password-in-clear-text

    - name: Restore NuGet packages
      run: dotnet restore ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}}

    - name: Restore MAUI workloads (including arm64 runtime)
      run: dotnet workload restore --project ${{env.PROJECT_PATH}} --configfile ${{env.NUGET_CONFIG_PATH}} --skip-manifest-update

    - name: Restore Windows RID runtime packs for ${{ matrix.arch }}
      run: dotnet restore ${{env.PROJECT_PATH}} -c Release -f ${{env.NET_TFM}}-windows10.0.19041.0 -r ${{matrix.runtime_id}} --configfile ${{env.NUGET_CONFIG_PATH}}

    - name: Set API Key
      run: |
        $file = 'src/Hacked.Maui/appsettings.json'
        $config = Get-Content $file -Raw | ConvertFrom-Json
        $config.HibpApiKey = $env:HIBP_API_KEY
        $config | ConvertTo-Json -Depth 10 | Set-Content -Path $file -Encoding utf8NoBOM
      env:
        HIBP_API_KEY: ${{secrets.HIBP_API_KEY}}
          
    - name: Publish ${{ matrix.arch }} package
      id: publish-package
      run: |
        # Unlock certificate using SafeNet authentication client (USB hardware token must be plugged in)
        $sacTools = "C:\Program Files\SafeNet\Authentication\SAC\x64\SACTools.exe"
        & $sacTools /Token /LogOn /Password "${{secrets.DIGICERT_HARDWARE_TOKEN_PASSWORD}}"

        $thumbprint = "8BC202959D2DCE3EEB3A489D8348B5C9B6B64A97"
        $subjectName = (Get-Item "Cert:\CurrentUser\My\$thumbprint").Subject
        $subjectNameForMsBuild = $subjectName.Replace(',', '%2c').Replace(';', '%3b')
        $appVersion = "${{needs.shared-resources.outputs.app_version}}.0"
        $artifactDir = "${{github.workspace}}\artifacts\${{matrix.arch}}"
        
        New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

        Write-Host "Publishing ${{matrix.arch}}..."
        dotnet clean ${{env.PROJECT_PATH}} -c Release -f ${{env.NET_TFM}}-windows10.0.19041.0
        
        $publishArgs = @(
          'publish'
          '${{env.PROJECT_PATH}}'
          '--no-restore'
          '-c', 'Release'
          '-f', '${{env.NET_TFM}}-windows10.0.19041.0'
          '-p:AppxPackageSigningEnabled=true'
          '-p:UapAppxPackageBuildMode=SideloadOnly'
          '-p:AppxBundle=Never'
          '-p:PlatformTarget=${{matrix.platform_target}}'
          '-p:RuntimeIdentifier=${{matrix.runtime_id}}'
          "-p:PackageCertificateThumbprint=$thumbprint"
          "-p:AppxPackageCertificateSubjectName=$subjectNameForMsBuild"
          "-p:AppxPackageVersion=$appVersion"
          '-p:AppxPublisherDisplayName=Lancelot Software'
        )
        & dotnet @publishArgs
        
        $msix = Get-ChildItem -Filter Hacked*.msix -Recurse | Select-Object -ExpandProperty FullName -First 1
        if (-not $msix) { throw "No .msix found after publish for ${{matrix.arch}}" }
        Write-Host "Found ${{matrix.arch}} package: $msix"
        Copy-Item -Path $msix -Destination "$artifactDir\Hacked.${{matrix.arch}}.msix" -Force
        
        echo "PACKAGE_PATH=$artifactDir\Hacked.${{matrix.arch}}.msix" >> $env:GITHUB_OUTPUT

    - name: Upload ${{ matrix.arch }} artifact
      uses: actions/upload-artifact@v7
      with:     
        name: "msix-${{matrix.arch}}"
        path: ${{steps.publish-package.outputs.PACKAGE_PATH}}
        if-no-files-found: error
        retention-days: 30

  # ********************************************************************************** #
  #                                Bundle msixbundle                                   #
  # ********************************************************************************** #
  bundle-packages:
    name: Bundle MSIX Packages
    needs: [shared-resources, maui-windows-sideload]
    runs-on: [self-hosted, x64]
    steps:
    - name: Download x64 artifact
      uses: actions/download-artifact@v7
      with:
        name: msix-x64
        path: ${{ github.workspace }}/packages

    - name: Download arm64 artifact
      uses: actions/download-artifact@v7
      with:
        name: msix-arm64
        path: ${{ github.workspace }}/packages

    - name: Create msixbundle
      id: create-bundle
      run: |
        $appVersion = "${{needs.shared-resources.outputs.app_version}}.0"
        $bundleDir = "${{github.workspace}}\packages"
        $bundlePath = "$bundleDir\Hacked.$appVersion.msixbundle"
        
        Write-Host "Creating msixbundle from packages in $bundleDir..."
        $makeappx = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\MakeAppx.exe"
        & $makeappx bundle /d "$bundleDir" /p $bundlePath
        
        if (-not (Test-Path $bundlePath)) { throw "Failed to create msixbundle at $bundlePath" }
        Write-Host "Created bundle: $bundlePath"
        
        echo "BUNDLE_PATH=$bundlePath" >> $env:GITHUB_OUTPUT

    - name: Attach bundle artifact to workflow run
      uses: actions/upload-artifact@v7
      with:     
        name: "Hacked_v${{needs.shared-resources.outputs.app_version}}_msixbundle"
        path: ${{ steps.create-bundle.outputs.BUNDLE_PATH }}
        if-no-files-found: error
        retention-days: 30
