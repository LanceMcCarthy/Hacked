name: Build Uno

on:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

env:
  STEP_TIMEOUT_MINUTES: 60
  TELERIK_USERNAME: ${{secrets.MyTelerikAccountUsername}}
  TELERIK_PASSWORD: ${{secrets.MyTelerikAccountPassword}}

jobs:
  smoke_test:
    name: Smoke Test (Debug Build of Hacked)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Install Dependencies
      #   uses: LanceMcCarthy/InstallUnoDependencies@v1.0.2
      #   timeout-minutes: ${{fromJSON(env.STEP_TIMEOUT_MINUTES)}}

      - name: Setup .NET ${{inputs.dotnet-version}}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.2
      
      - name: Remove Telerik server from package sources for Uno Platform builds
        run: dotnet nuget remove source "Telerik" --configfile "src/nuget.config"
      
      - name: Build Hacked (Debug)
        run: msbuild src/Uno/Hacked/Hacked.csproj /r

  unit_test:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Install Dependencies
      #   uses: LanceMcCarthy/InstallUnoDependencies@v1.0.2
      #   timeout-minutes: ${{fromJSON(env.STEP_TIMEOUT_MINUTES)}}

      - name: Setup .NET ${{inputs.dotnet-version}}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.2
      
      - name: Remove Telerik server from package sources for Uno Platform builds
        run: dotnet nuget remove source "Telerik" --configfile "src/nuget.config"
      
      - name: Build Hacked.Tests (Release)
        run: msbuild src/Uno/Hacked.Tests/Hacked.Tests.csproj /p:Configuration=Release /p:OverrideTargetFramework=net8.0 /r

      - name: Run Unit Tests
        run: dotnet test src/Uno/Hacked.Tests/Hacked.Tests.csproj --no-build -c Release --logger GitHubActions --blame-crash --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
