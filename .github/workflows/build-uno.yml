name: Uno Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - 'src/Hacked.Uno/**'
      - 'src/Hacked.Core/**'
      - 'src/Hacked.Services/**'
      - '.github/workflows/build-uno.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/Hacked.Uno/**'
      - 'src/Hacked.Core/**'
      - 'src/Hacked.Services/**'
      - '.github/workflows/build-uno.yml'
  workflow_dispatch:

env:
  BLD_CONFIG: 'Debug'
  DOTNET_VERSION: '9.0.x'
  NUGET_CONFIG: 'src/nuget.config'
  XCODE_VERSION: '26.2'
  IOS_TFM: 'net9.0-ios'
  MACCATALYST_TFM: 'net9.0-maccatalyst'
  WINDOWS_TFM: 'net9.0-windows10.0.19041'
  ANDROID_TFM: 'net9.0-android'

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  # Builds the WinUI target and runs unit tests.
  # net9.0-windows needs no extra workloads on windows-latest.
  build-windows:
    name: Windows (net9.0-windows)
    runs-on: windows-latest
    env:
      TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{env.DOTNET_VERSION}}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}

      - name: Restore shared libs
        run: |
          dotnet restore src/Hacked.Core/Hacked.Core.csproj --configfile ${{env.NUGET_CONFIG}} --nologo
          dotnet restore src/Hacked.Services/Hacked.Services.csproj --configfile ${{env.NUGET_CONFIG}} --nologo

      - name: Restore Hacked (Windows TFM only)
        run: >
          dotnet restore src/Hacked.Uno/Hacked/Hacked.csproj
          --no-dependencies
          -p:TargetFramework=net9.0-windows10.0.19041
          --configfile ${{env.NUGET_CONFIG}}
          --nologo

      - name: Build
        run: dotnet build src/Hacked.Uno/Hacked/Hacked.csproj -c ${{env.BLD_CONFIG}} -f ${{env.WINDOWS_TFM}} --no-restore --nologo

      - name: Restore tests
        run: dotnet restore src/Hacked.Uno/Hacked.Tests/Hacked.Tests.csproj --configfile ${{env.NUGET_CONFIG}} --nologo

      - name: Unit Tests
        run: >
          dotnet test src/Hacked.Uno/Hacked.Tests/Hacked.Tests.csproj
          -c Release
          --no-restore
          --nologo
          --logger GitHubActions
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: '**/*.trx'

  # ── macOS ──────────────────────────────────────────────────────────────────
  # Builds iOS and macCatalyst targets.
  # Xcode is pre-installed on macos-latest; ios + maccatalyst workloads are
  # installable only on macOS runners.
  build-macos:
    name: macOS (net9.0-ios / net9.0-maccatalyst)
    runs-on: macos-latest
    env:
      TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET ${{env.DOTNET_VERSION}}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{env.XCODE_VERSION}}

      - name: Install workloads
        run: dotnet workload install ios maccatalyst --skip-sign-check

      - name: Restore shared libs
        run: |
          dotnet restore src/Hacked.Core/Hacked.Core.csproj --configfile ${{env.NUGET_CONFIG}} --nologo
          dotnet restore src/Hacked.Services/Hacked.Services.csproj --configfile ${{env.NUGET_CONFIG}} --nologo

      - name: Restore Hacked (iOS TFM only)
        run: >
          dotnet restore src/Hacked.Uno/Hacked/Hacked.csproj
          --no-dependencies
          -p:TargetFramework=${{env.IOS_TFM}}
          --configfile ${{env.NUGET_CONFIG}}
          --nologo

      - name: Build iOS
        run: dotnet build src/Hacked.Uno/Hacked/Hacked.csproj -c ${{env.BLD_CONFIG}} -f ${{env.IOS_TFM}} --no-restore --nologo

      - name: Restore Hacked (macCatalyst TFM only)
        run: >
          dotnet restore src/Hacked.Uno/Hacked/Hacked.csproj
          --no-dependencies
          -p:TargetFramework=${{env.MACCATALYST_TFM}}
          --configfile ${{env.NUGET_CONFIG}}
          --nologo

      - name: Build macCatalyst
        run: dotnet build src/Hacked.Uno/Hacked/Hacked.csproj -c ${{env.BLD_CONFIG}} -f ${{env.MACCATALYST_TFM}} --no-restore --nologo

  # ── Mobile / Android ───────────────────────────────────────────────────────
  # Builds the Android target on a Linux runner.
  build-android:
    name: Mobile (net9.0-android)
    runs-on: ubuntu-latest
    env:
      TELERIK_NUGET_KEY: ${{secrets.TELERIK_NUGET_KEY}}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET ${{env.DOTNET_VERSION}}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}

      - name: Install workloads
        run: dotnet workload install android --skip-sign-check

      - name: Restore shared libs
        run: |
          dotnet restore src/Hacked.Core/Hacked.Core.csproj --configfile ${{env.NUGET_CONFIG}} --nologo
          dotnet restore src/Hacked.Services/Hacked.Services.csproj --configfile ${{env.NUGET_CONFIG}} --nologo

      - name: Restore Hacked (Android TFM only)
        run: >
          dotnet restore src/Hacked.Uno/Hacked/Hacked.csproj
          --no-dependencies
          -p:TargetFramework=net9.0-android
          --configfile ${{env.NUGET_CONFIG}}
          --nologo

      - name: Build Android
        run: dotnet build src/Hacked.Uno/Hacked/Hacked.csproj -c ${{env.BLD_CONFIG}} -f ${{env.ANDROID_TFM}} --no-restore --nologo

